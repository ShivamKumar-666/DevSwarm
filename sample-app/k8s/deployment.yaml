apiVersion: apps/v1
kind: Deployment
metadata:
  name: devswarm-demo
  labels:
    app: devswarm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devswarm-demo
  template:
    metadata:
      labels:
        app: devswarm-demo
    spec:
      containers:
      - name: web
        image: devswarm-app:latest
        imagePullPolicy: Never # Force pulling from local kind registry
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devswarm-demo-svc
spec:
  type: NodePort
  selector:
    app: devswarm-demo
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
