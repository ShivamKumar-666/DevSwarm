

services:
  # RAG Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Event Bus
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Standard Log Storage / State Storage
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: devswarm
      POSTGRES_PASSWORD: devswarmpassword
      POSTGRES_DB: devswarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Orchestrator (Stubbed for now, will run locally during dev)
  orchestrator:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql://devswarm:devswarmpassword@postgres:5432/devswarm
    depends_on:
      - qdrant
      - redis
      - postgres
    profiles:
      - full # Use `docker-compose --profile full up` to run the orchestrator in docker

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
